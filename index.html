<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ph-y</title>
<meta name="description" content="Эффект цифровых мыльниц 2000-х: съёмка с живым фильтром и обработка фото в полном разрешении.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ph-y">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Mylnitsa v3 — Photos-editor style: black canvas, photo first, controls in a compact bottom stack */
:root{
  --bg:#000; --panel:rgba(28,28,30,.92); --label:#fff; --sec:rgba(235,235,245,.6); --ter:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --yellow:#ffd60a; --tint:#0a84ff; --red:#ff453a; --fill:rgba(118,118,128,.24);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{color:var(--label);font:15px/1.3 var(--font);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}

.app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.top{flex:0 0 auto;height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;position:relative;z-index:4}
.top .l{justify-self:start;display:flex;gap:16px;align-items:center}
.top .r{justify-self:end;display:flex;gap:16px;align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:6px;font-size:17px;color:var(--label);height:44px}
.tbtn svg{width:22px;height:22px}
.tbtn.y{color:var(--yellow);font-weight:600}
.pill{height:30px;padding:0 12px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pill svg{width:16px;height:16px}
.ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--label)}
.ico svg{width:22px;height:22px}
.ico[aria-pressed="true"]{color:var(--yellow)}

.stage{flex:1 1 auto;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;touch-action:none}
body.cam .stage{place-items:start center}
.frame{position:relative;line-height:0}
#view{display:block}
#view.mirror{transform:scaleX(-1)}
.grid{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
  linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% + .5px),transparent calc(66.66% + .5px));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85)}
.marker{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 6px rgba(0,0,0,.4);pointer-events:none;display:grid;place-items:center}
.marker svg{width:14px;height:14px}
.badge{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-size:13px;font-weight:600;line-height:1;padding:7px 11px;border-radius:999px;white-space:nowrap;z-index:3}
.fname{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:28px;font-weight:700;letter-spacing:.01em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .35s;white-space:nowrap}
.fname.on{opacity:1;transition:none}
.shotmsg{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font-size:14px;padding:6px 6px 6px 14px;border-radius:999px;white-space:nowrap;z-index:3}
.shotmsg button{background:#fff;color:#000;font-weight:600;font-size:14px;padding:7px 12px;border-radius:999px}
.lenses{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(0,0,0,.35);padding:4px;border-radius:999px;z-index:2}
.lenses button{min-width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:12px;font-weight:600}
.lenses button[aria-pressed="true"]{color:var(--yellow);font-size:13px}
.sample{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-size:13px;line-height:1.2;padding:7px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}

/* bottom stack */
.bottom{flex:0 0 auto;position:relative;z-index:3;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 4px);width:100%;max-width:680px;margin:0 auto}
.adjust{display:grid;gap:4px;padding-top:6px}
body.cam .adjust{position:absolute;left:0;right:0;bottom:100%;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,.5) 70%,rgba(0,0,0,0));padding:22px 0 6px}
.readout{display:flex;justify-content:center;gap:8px;align-items:baseline;height:18px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sec)}
.readout b{color:var(--label);font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums}
.dial{position:relative;height:40px;touch-action:none;cursor:ew-resize}
.dial canvas{width:100%;height:100%;display:block}
.opts{display:flex;justify-content:center;gap:6px;height:40px;align-items:center;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.opts::-webkit-scrollbar{display:none}
.opts button{height:30px;padding:0 13px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:600;white-space:nowrap;color:var(--sec)}
.opts button[aria-pressed="true"]{background:#fff;color:#000}
.row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.it{flex:0 0 auto;width:48px;display:grid;justify-items:center;gap:4px;scroll-snap-align:center}
.it .ring{width:44px;height:44px;border-radius:50%;position:relative;display:grid;place-items:center;color:var(--sec)}
.it .ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--yellow) calc(var(--v,0)*1turn),rgba(255,255,255,.22) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px))}
.it .ring.neg::before{background:conic-gradient(from calc(var(--v,0)*-1turn),var(--yellow) calc(var(--v,0)*1turn),rgba(255,255,255,.22) 0)}
.it svg{width:20px;height:20px}
.it span{font-size:10px;line-height:12px;color:var(--ter);white-space:nowrap}
.it[aria-pressed="true"] .ring{color:#fff}
.it[aria-pressed="true"] .ring::before{background:conic-gradient(var(--yellow) calc(var(--v,0)*1turn),rgba(255,255,255,.9) 0)}
.it[aria-pressed="true"] span{color:#fff}
.chip{flex:0 0 auto;height:32px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:600;white-space:nowrap;color:var(--sec);scroll-snap-align:center;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:#fff;color:#000}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);padding:4px 24px 0}
.tab{display:grid;justify-items:center;gap:3px;padding:6px 0;color:var(--sec);font-size:11px;font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--yellow)}
.shoot{display:none}
body.cam .shoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 28px 6px}
body.cam .tabs{display:none}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shutter i{width:60px;height:60px;border-radius:50%;background:#fff;transition:transform .12s}
.shutter:active i{transform:scale(.9)}
.last{width:46px;height:46px;border-radius:8px;overflow:hidden;background:#2c2c2e;justify-self:start}
.last img{width:100%;height:100%;object-fit:cover;display:block}
.hq{justify-self:end;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;letter-spacing:.02em}
.flashfx{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.flashfx.on{opacity:.8;transition:none}
.toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(44,44,46,.92);color:#fff;font-size:13px;padding:8px 14px;border-radius:12px;max-width:calc(100% - 32px);text-align:center;z-index:5;pointer-events:none}

/* album */
.album{position:fixed;inset:0;z-index:10;background:#000;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.album .top{flex:0 0 auto}
.agrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:2px;align-content:start;padding:2px 2px calc(env(safe-area-inset-bottom,0px) + 80px);-webkit-overflow-scrolling:touch}
.cell{position:relative;display:block;width:100%;height:0;padding:0 0 100%;background:#1c1c1e;overflow:hidden}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cell.add>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.cell.add{color:var(--tint);font-size:14px;font-weight:600}
.cell.add b{font-size:34px;line-height:1;font-weight:300}
.cell .tick{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:50%;border:1.5px solid #fff;background:rgba(0,0,0,.25)}
.cell[aria-pressed="true"] .tick{background:var(--tint);border-color:#fff}
.cell[aria-pressed="true"] .tick::after{content:"";position:absolute;left:6px;top:3px;width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cell.cur::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--yellow)}
.abar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 10px);background:rgba(18,18,18,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:16px}
.abar .red{color:var(--red)} .abar .blue{color:var(--tint)}
.abar button:disabled{opacity:.35}
.aempty{grid-column:1/-1;color:var(--sec);padding:20px 16px;font-size:14px;text-align:center}

/* action sheet */
.sheet{position:fixed;inset:0;z-index:30;display:grid;align-items:end;background:rgba(0,0,0,.4);padding:0 8px calc(8px + env(safe-area-inset-bottom,0px))}
.sheet .box{max-width:560px;width:100%;margin:0 auto;display:grid;gap:8px}
.sheet .grp{background:rgba(44,44,46,.96);border-radius:14px;overflow:hidden}
.sheet .msg{padding:14px 16px;text-align:center;font-size:13px;color:var(--sec);line-height:1.35}
.sheet .msg b{display:block;color:var(--label);font-size:15px;margin-bottom:3px;font-weight:600}
.sheet .act{display:block;width:100%;padding:17px;text-align:center;font-size:19px;color:var(--tint);border-top:.5px solid var(--sep)}
.sheet .act.bold{font-weight:600}
.sheet .act.red{color:var(--red)}
.progress{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin:10px 16px 14px}
.progress i{display:block;height:100%;background:var(--tint);width:0;transition:width .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v4: modes, viewer bar, zoom, timer */
.vbar{display:none}
body.view .vbar{display:grid;grid-template-columns:44px 1fr 44px 44px;align-items:center;padding:6px 14px 4px}
.vinfo{text-align:center;display:grid;gap:2px}
.vinfo b{font-size:14px;font-weight:600}
.vinfo span{font-size:12px;color:var(--sec)}
body.view .adjust, body.view .tabs{display:none}
body:not(.view) .vbar{display:none}
body.edit .tabs{display:grid}
.ico{position:relative}
.zoomv{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(0,0,0,.5);color:var(--yellow);font-size:17px;font-weight:700;padding:8px 14px;border-radius:999px;pointer-events:none}
.count{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:110px;font-weight:200;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.6);pointer-events:none}
.lenses button.on{color:var(--yellow)}

/* v5: exposure box, camera grid */
.expo{position:absolute;width:0;height:0;pointer-events:none;z-index:3}
.expo i{position:absolute;left:-38px;top:-38px;width:76px;height:76px;border:1.5px solid var(--yellow);border-radius:2px}
.expo .sun{position:absolute;left:46px;top:-12px;display:flex;align-items:center;gap:3px;color:var(--yellow);font-size:13px;font-weight:600;white-space:nowrap}
.expo .sun svg{width:18px;height:18px}
.expo:not(.set) .sun b{display:none}

/* v6: icons follow the phone orientation, like the iPhone camera */
body.cam .top .ico svg, body.cam .lenses button, body.cam .hq, body.cam .last{transition:transform .3s}
body.cam[data-rot="1"] .top .ico svg, body.cam[data-rot="1"] .lenses button, body.cam[data-rot="1"] .hq, body.cam[data-rot="1"] .last{transform:rotate(-90deg)}
body.cam[data-rot="3"] .top .ico svg, body.cam[data-rot="3"] .lenses button, body.cam[data-rot="3"] .hq, body.cam[data-rot="3"] .last{transform:rotate(90deg)}
body.cam[data-rot="2"] .top .ico svg, body.cam[data-rot="2"] .lenses button, body.cam[data-rot="2"] .hq, body.cam[data-rot="2"] .last{transform:rotate(180deg)}

</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <div class="l">
      <button class="tbtn" id="openCam" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.6l1.6-2.2h6.6L16.9 7h2.6A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.8" r="3.6"/></svg>Камера</button>
      <button class="tbtn" id="cancelEdit" type="button" hidden>Отменить</button>
      <button class="ico" id="closeCam" type="button" aria-label="Закрыть камеру" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="c">
      <button class="pill" id="openAlbum" type="button"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.2"/><rect x="9" y="1" width="6" height="6" rx="1.2"/><rect x="1" y="9" width="6" height="6" rx="1.2"/><rect x="9" y="9" width="6" height="6" rx="1.2"/></svg><span id="albumCount">Альбом</span></button>
      <div id="camToggles" hidden style="display:flex;gap:6px">
        <button class="ico" id="tgDate" type="button" aria-label="Дата в углу" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
        <button class="ico" id="tgFlash" type="button" aria-label="Вспышка" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 5 13h6l-1 9 8-11h-6z"/></svg></button>
        <button class="ico" id="tgTimer" type="button" aria-label="Таймер" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><b id="timerVal" style="position:absolute;font-size:9px;margin:20px 0 0 20px"></b></button>
        <button class="ico" id="tgTap" type="button" aria-label="Снимать касанием кадра" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1a1.5 1.5 0 0 1 3 0v1.5m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.5a6 6 0 0 1-4.6-2.2L4.6 15.6a1.5 1.5 0 0 1 2.3-1.9L9 16"/></svg></button>
        <button class="ico" id="tgOrient" type="button" aria-label="Ориентация снимка" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.2"/><path d="M11 18h2"/></svg></button>
        <button class="ico" id="tgGrid" type="button" aria-label="Сетка" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></svg></button>
        <button class="ico" id="tgAdj" type="button" aria-label="Настройки" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      </div>
    </div>
    <div class="r">
      <button class="tbtn y" id="editBtn" type="button">Править</button>
      <button class="tbtn y" id="doneEdit" type="button" hidden>Готово</button>
      <button class="ico" id="flipCam" type="button" aria-label="Сменить камеру" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 4v4h-4M20 15a8 8 0 0 1-14 3l-2-2M4 20v-4h4"/></svg></button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="view" width="1200" height="800" aria-label="Фото с эффектом. Удерживайте, чтобы увидеть оригинал; проведите влево или вправо, чтобы сменить фильтр"></canvas>
      <div class="grid" id="grid" hidden></div>
      <div class="marker" id="marker" hidden><svg viewBox="0 0 14 16" aria-hidden="true"><path d="M8 0 1 9h5l-1 7 8-10H8l1-6z" fill="#ffd60a"/></svg></div>
      <div class="lenses" id="lenses" hidden></div>
    </div>
    <div class="fname" id="fname"></div>
    <div class="badge" id="badge" hidden>Оригинал</div>
    <div class="shotmsg" id="shotmsg" hidden><span id="shottext">Снято</span><button type="button" id="shotSave">В Фото</button></div>
    <div class="sample" id="sampleTag">Пример</div>
    <div class="toast" id="toast" hidden role="status"></div>
    <div class="zoomv" id="zoomv" hidden></div>
    <div class="expo" id="expo" hidden><i></i><span class="sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg><b id="expoV"></b></span></div>
    <div class="count" id="countdown" hidden></div>
  </div>

  <div class="bottom" id="bottom">
    <div class="adjust" id="adjust">
      <div class="readout" id="readout"><span id="rLabel"></span><b id="rVal"></b></div>
      <div class="dial" id="dial"><canvas id="dialC"></canvas></div>
      <div class="opts" id="opts" hidden></div>
      <div class="row" id="items" role="group"></div>
    </div>
    <div class="row" id="camFilters" hidden></div>
    <div class="shoot">
      <button class="last" id="lastShot" type="button" aria-label="Открыть альбом"></button>
      <button class="shutter" id="shutter" type="button" aria-label="Снять"><i></i></button>
      <label class="hq" for="nativeCam" aria-label="Снять камерой iPhone в полном качестве">HQ<input id="nativeCam" type="file" accept="image/*" capture="environment" hidden></label>
    </div>
    <div class="vbar" id="vbar">
      <button class="ico" id="vShare" type="button" aria-label="Сохранить в Фото"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5a1.5 1.5 0 0 0-1.5 1.5v7A1.5 1.5 0 0 0 5 21h14a1.5 1.5 0 0 0 1.5-1.5v-7A1.5 1.5 0 0 0 19 11h-1"/></svg></button>
      <div class="vinfo"><b id="vDate"></b><span id="vMeta"></span></div>
      <button class="ico" id="vRot" type="button" aria-label="Повернуть фото"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h9a4 4 0 0 1 4 4v6"/><path d="M8 6 5 9l3 3"/><rect x="5" y="13" width="9" height="7" rx="1.5"/></svg></button>
      <button class="ico" id="vDel" type="button" aria-label="Удалить фото"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h16M9.5 6.5V4.5h5v2M6.5 6.5l1 13a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4l1-13M10 10.5v6.5M14 10.5v6.5"/></svg></button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-flt" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><circle cx="15" cy="9" r="5.5"/><circle cx="12" cy="14.5" r="5.5"/></svg>Фильтры</button>
      <button class="tab" role="tab" id="t-adj" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M12 7.5h4M12 12h6M12 16.5h4"/></svg>Настройки</button>
      <button class="tab" role="tab" id="t-crop" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></svg>Кадр</button>
    </nav>
  </div>
  <input id="file" type="file" accept="image/*,.heic,.heif" multiple hidden>
</div>

<div class="album" id="album" hidden>
  <header class="top">
    <div class="l"><button class="tbtn y" id="albumDone" type="button">Готово</button></div>
    <div class="c" style="font-weight:600;font-size:17px">Альбом</div>
    <div class="r"><button class="tbtn" id="albumSelect" type="button">Выбрать</button></div>
  </header>
  <div class="agrid" id="agrid"></div>
  <div class="abar" id="abar" hidden>
    <button type="button" class="blue" id="aSave">Сохранить</button>
    <button type="button" class="blue" id="aApply">Применить настройки</button>
    <button type="button" class="red" id="aDelete">Удалить</button>
  </div>
</div>
<div class="flashfx" id="flashfx"></div>
<div class="sheet" id="sheet" hidden><div class="box"><div class="grp" id="sheetMain"></div><div class="grp"><button type="button" class="act bold" id="sheetCancel">Отмена</button></div></div></div>

<script src="util.js?v=7"></script>
<script src="gl.js?v=7"></script>
<script src="presets.js?v=7"></script>
<script src="sample.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
